<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#050817"><title>Galaxy Defender — R.A Studios</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050817;color:#eef7ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none}button{border:1px solid #3988b5;border-radius:12px;padding:13px 18px;color:#eef7ff;background:linear-gradient(135deg,#075d85,#54208a);font-weight:800;font-size:15px;letter-spacing:.4px;box-shadow:0 0 18px #05b9ff33}button:active{transform:scale(.97)}#game{position:fixed;inset:0;width:100%;height:100%}#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none;text-shadow:0 0 12px #00cfff;font-weight:800;font-size:13px} .stat{padding:7px 10px;background:#07142bd9;border:1px solid #1a4d71;border-radius:10px;min-width:76px}#power{position:absolute;top:62px;left:10px;right:10px;text-align:center;color:#4ef6ff;font-size:12px;font-weight:800;pointer-events:none}#controls{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;gap:10px}#controls button{font-size:12px;padding:12px 13px}#screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(ellipse at 50% 40%,#18204c99,#030611eF 70%)}.panel{text-align:center;width:min(440px,100%);padding:26px 18px;border:1px solid #3277a8;border-radius:22px;background:#071127eF;box-shadow:0 0 55px #07bfff24}.logo{font-size:clamp(36px,9vw,60px);font-weight:1000;letter-spacing:2px;line-height:1.05;background:linear-gradient(90deg,#39f6ff,#ff4e99,#ffcf4a,#6cffac);color:transparent;background-clip:text;-webkit-background-clip:text}.subtitle{color:#9ab9e6;letter-spacing:3px;font-size:12px;margin:12px 0 25px}.panel p{line-height:1.65;color:#d2e4ff}.panel button{display:block;width:100%;margin:10px 0}.small{font-size:11px;color:#8aa5d4;margin-top:20px}#pause{position:absolute;right:10px;top:100px;padding:8px 13px} .hidden{display:none!important}
</style></head><body><canvas id="game"></canvas><div id="hud" class="hidden"><div class="stat">SCORE<br><span id="score">0</span></div><div class="stat">LIVES<br><span id="lives">♥ ♥ ♥</span></div><div class="stat">WAVE<br><span id="level">1</span></div></div><div id="power"></div><button id="pause" class="hidden">Ⅱ</button><div id="controls" class="hidden"><button id="auto">AUTO: ON</button><button id="fire">✦ FIRE</button></div><div id="screen"><div class="panel"><div class="logo">R.A STUDIOS</div><div class="subtitle">IMAGINE • CREATE • PLAY</div><h1 style="color:#55edff;font-size:34px;margin:0">GALAXY<br>DEFENDER</h1><p>Protect the galaxy. Survive the waves.<br>Swipe to steer • Auto-fire • Collect power-ups</p><button id="start">▶ START MISSION</button><button id="help">HOW TO PLAY</button><div class="small">MADE BY R.A STUDIOS</div></div></div>
<script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),screen=document.getElementById('screen'),hud=document.getElementById('hud'),controls=document.getElementById('controls'),pauseBtn=document.getElementById('pause'),power=document.getElementById('power');let W=0,H=0,dpr=1,mode='menu',last=0,score=0,lives=3,level=1,elapsed=0,spawn=0,bossTimer=0,fireTimer=0,invuln=0,shield=0,rapid=0,auto=true,ship={x:.5,y:.16},bullets=[],enemies=[],eb=[],ups=[],particles=[],stars=[];const rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b,x,y)=>Math.hypot(a-x,b-y);function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:100},()=>({x:Math.random()*W,y:Math.random()*H,r:rand(.5,2),v:rand(20,80)}))}addEventListener('resize',resize);resize();function showMenu(title='GALAXY DEFENDER',desc='Protect the galaxy. Survive the waves.'){screen.classList.remove('hidden');screen.innerHTML=`<div class="panel"><div class="logo">R.A STUDIOS</div><div class="subtitle">IMAGINE • CREATE • PLAY</div><h1 style="color:#55edff;font-size:34px;margin:0">${title}</h1><p>${desc}</p><button id="again">${mode==='over'?'↻ PLAY AGAIN':'▶ START MISSION'}</button><button id="how">HOW TO PLAY</button><div class="small">Swipe to steer • Auto-fire • Collect upgrades<br>MADE BY R.A STUDIOS</div></div>`;document.getElementById('again').onclick=startGame;document.getElementById('how').onclick=()=>showMenu('HOW TO PLAY','DRAG OR SWIPE to move your ship.<br>Your ship auto-fires; tap FIRE for extra shots.<br><br>CYAN = shield • GOLD = rapid fire • GREEN = extra life<br><br>Scout +10 • Zigzag +20 • Tank +35 • Boss +250<br><br>Avoid enemy shots and collect upgrades!')}function startGame(){score=0;lives=3;level=1;elapsed=spawn=bossTimer=fireTimer=0;invuln=1.5;shield=rapid=0;ship={x:.5,y:.16};bullets=[];enemies=[];eb=[];ups=[];particles=[];mode='play';screen.classList.add('hidden');hud.classList.remove('hidden');controls.classList.remove('hidden');pauseBtn.classList.remove('hidden');updateHud()}function updateHud(){document.getElementById('score').textContent=score;document.getElementById('lives').textContent='♥ '.repeat(lives).trim()+(lives===5?' +':'');document.getElementById('level').textContent=level;let p=[];if(shield>0)p.push('SHIELD '+Math.ceil(shield)+'s');if(rapid>0)p.push('RAPID '+Math.ceil(rapid)+'s');power.textContent=p.join(' • ')}function addBurst(x,y,color,n=12){for(let i=0;i<n;i++){let a=rand(0,Math.PI*2),v=rand(40,180);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:rand(.2,.6),color,r:rand(1,4)})}}function spawnEnemy(){let kind=Math.random()<.6?'scout':Math.random()<.78?'zigzag':'tank';if(level>=4&&Math.random()<.12)kind='tank';let size={scout:25,zigzag:29,tank:39}[kind],hp={scout:1,zigzag:2,tank:4}[kind];enemies.push({x:rand(W*.1,W*.9),y:H+size,size,kind,hp,maxhp:hp,speed:({scout:105,zigzag:125,tank:55}[kind])+level*7,phase:rand(0,6),shoot:rand(1,2.5)})}function spawnBoss(){if(enemies.some(e=>e.kind==='boss'))return;let size=74;enemies.push({x:W*.5,y:H+size,size,kind:'boss',hp:18+level*3,maxhp:18+level*3,speed:35,phase:0,shoot:.7});power.textContent='⚠ BOSS INCOMING!'}function fire(){if(mode!=='play')return;let x=ship.x*W,y=ship.y*H;bullets.push({x,y:y+20,vx:0,vy:-470},{x:x-11,y:y+7,vx:-18,vy:-440},{x:x+11,y:y+7,vx:18,vy:-440})}function damage(){if(invuln>0)return;if(shield>0){shield=0;invuln=.6;addBurst(ship.x*W,ship.y*H,'#39efff',18);return}lives--;invuln=1.4;addBurst(ship.x*W,ship.y*H,'#ff4086',22);updateHud();if(lives<=0){mode='over';hud.classList.add('hidden');controls.classList.add('hidden');pauseBtn.classList.add('hidden');showMenu('MISSION OVER',`Final score: <b>${score}</b> • Wave: <b>${level}</b>`);}}function togglePause(){if(mode==='play'){mode='paused';showMenu('PAUSED','Take a breath, pilot.');document.getElementById('again').textContent='▶ RESUME';document.getElementById('again').onclick=()=>{mode='play';screen.classList.add('hidden');last=performance.now()};}else if(mode==='paused'){mode='play';screen.classList.add('hidden');last=performance.now()}}pauseBtn.onclick=togglePause;document.getElementById('start').onclick=startGame;document.getElementById('help').onclick=()=>showMenu('HOW TO PLAY','DRAG OR SWIPE to steer.<br>Auto-fire is on by default.<br><br>CYAN = shield • GOLD = rapid fire • GREEN = extra life<br><br>Scout +10 • Zigzag +20 • Tank +35 • Boss +250');document.getElementById('fire').onclick=fire;document.getElementById('auto').onclick=()=>{auto=!auto;document.getElementById('auto').textContent='AUTO: '+(auto?'ON':'OFF')};let pointer=false;function steer(e){if(!pointer||mode!=='play')return;ship.x=Math.max(.06,Math.min(.94,e.clientX/W));ship.y=Math.max(.08,Math.min(.72,e.clientY/H))}c.addEventListener('pointerdown',e=>{pointer=true;steer(e)});addEventListener('pointermove',steer);addEventListener('pointerup',()=>pointer=false);function drawShip(x,y){ctx.save();ctx.translate(x,y);ctx.shadowBlur=20;ctx.shadowColor='#10dfff';if(shield>0){ctx.strokeStyle='#48f5ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,29,0,Math.PI*2);ctx.stroke()}ctx.fillStyle='#10dfff';ctx.beginPath();ctx.moveTo(0,25);ctx.lineTo(-18,-13);ctx.lineTo(0,-7);ctx.lineTo(18,-13);ctx.closePath();ctx.fill();ctx.fillStyle='#efffff';ctx.beginPath();ctx.moveTo(0,19);ctx.lineTo(-8,-11);ctx.lineTo(8,-11);ctx.closePath();ctx.fill();ctx.fillStyle='#ff8a38';ctx.beginPath();ctx.moveTo(-5,-12);ctx.lineTo(0,-25-rand(0,5));ctx.lineTo(5,-12);ctx.fill();ctx.restore()}function drawEnemy(e){let {x,y,size:s,kind}=e;ctx.save();ctx.translate(x,y);ctx.shadowBlur=16;ctx.shadowColor=kind==='boss'?'#ff1c65':'#ff275d';if(kind==='tank'){ctx.fillStyle='#c52962';ctx.fillRect(-s*.48,-s*.42,s*.96,s*.84);ctx.strokeStyle='#ff7d9b';ctx.strokeRect(-s*.48,-s*.42,s*.96,s*.84)}else{ctx.fillStyle=kind==='boss'?'#f51b58':'#f52d66';ctx.beginPath();ctx.moveTo(0,kind==='boss'?-s*.5:-s*.58);ctx.lineTo(-s*.55,s*.45);ctx.lineTo(s*.55,s*.45);ctx.closePath();ctx.fill();ctx.fillStyle='#2d0921';ctx.fillRect(-s*.25,-s*.1,s*.5,s*.2)}ctx.shadowBlur=0;ctx.fillStyle='#271024';ctx.fillRect(-s/2,s*.58,s,3);ctx.fillStyle='#4cff8a';ctx.fillRect(-s/2,s*.58,s*(e.hp/e.maxhp),3);ctx.restore()}function frame(now){let dt=Math.min((now-last)/1000||0,.04);last=now;ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#050817');g.addColorStop(1,'#0a1231');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let s of stars){s.y+=s.v*dt;if(s.y>H){s.y=0;s.x=Math.random()*W}ctx.fillStyle='rgba(125,190,255,.55)';ctx.fillRect(s.x,s.y,s.r,s.r)}ctx.strokeStyle='rgba(50,130,190,.08)';for(let i=1;i<6;i++){ctx.beginPath();ctx.moveTo(W*i/6,0);ctx.lineTo(W*i/6,H);ctx.stroke()}if(mode==='play'){elapsed+=dt;level=1+Math.floor(score/180);invuln=Math.max(0,invuln-dt);shield=Math.max(0,shield-dt);rapid=Math.max(0,rapid-dt);fireTimer-=dt;if(auto&&fireTimer<=0){fire();fireTimer=rapid>0?.16:.29}spawn-=dt;if(spawn<=0){spawnEnemy();spawn=Math.max(.3,1-level*.045)}bossTimer+=dt;if(bossTimer>=27){bossTimer=0;spawnBoss()}for(let b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt}bullets=bullets.filter(b=>b.y>-30&&b.x>0&&b.x<W);for(let e of enemies){e.phase+=dt*2;if(e.kind==='zigzag')e.x+=Math.sin(e.phase*2)*e.speed*dt*.8;if(e.kind==='boss'){e.x+=Math.sin(e.phase)*e.speed*dt*1.8;if(e.y>H*.77)e.y-=e.speed*dt}e.y-=e.speed*dt;e.x=Math.max(e.size*.6,Math.min(W-e.size*.6,e.x));e.shoot-=dt;if(e.shoot<=0&&e.y<H*.92){let dx=ship.x*W-e.x,dy=ship.y*H-e.y,l=Math.max(1,Math.hypot(dx,dy)),v=e.kind==='boss'?230:180;eb.push({x:e.x,y:e.y,vx:dx/l*v,vy:dy/l*v});e.shoot=e.kind==='boss'?.65:rand(1.7,3.2)}}for(let b of eb){b.x+=b.vx*dt;b.y+=b.vy*dt}eb=eb.filter(b=>b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);let kept=[];for(let b of bullets){let hit=enemies.find(e=>dist(b.x,b.y,e.x,e.y)<e.size*.55);if(hit){hit.hp--;addBurst(b.x,b.y,'#39efff',3);if(hit.hp<=0){score+=({scout:10,zigzag:20,tank:35,boss:250}[hit.kind]);addBurst(hit.x,hit.y,hit.kind==='boss'?'#ff4a91':'#ffcf4a',25);if(Math.random()<(hit.kind==='boss'?.28:.1))ups.push({x:hit.x,y:hit.y,kind:['shield','rapid','life'][Math.floor(Math.random()*3)]});enemies=enemies.filter(e=>e!==hit)}}else kept.push(b)}bullets=kept;let sx=ship.x*W,sy=ship.y*H;for(let e of [...enemies]){if(dist(sx,sy,e.x,e.y)<e.size*.55+10){enemies=enemies.filter(z=>z!==e);damage()}else if(e.y<-e.size)enemies=enemies.filter(z=>z!==e)}for(let b of [...eb])if(dist(b.x,b.y,sx,sy)<17){eb=eb.filter(z=>z!==b);damage()}for(let p of [...ups]){p.y-=90*dt;if(dist(p.x,p.y,sx,sy)<27){if(p.kind==='shield')shield=8;else if(p.kind==='rapid')rapid=8;else lives=Math.min(5,lives+1);ups=ups.filter(z=>z!==p);addBurst(sx,sy,'#39efff',15)}else if(p.y<-20)ups=ups.filter(z=>z!==p)}for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt}particles=particles.filter(p=>p.t>0);updateHud()}for(let b of bullets){ctx.shadowBlur=13;ctx.shadowColor='#32f5ff';ctx.fillStyle='#75ffff';ctx.fillRect(b.x-2,b.y,4,13)}ctx.shadowBlur=0;for(let e of enemies)drawEnemy(e);for(let b of eb){ctx.fillStyle='#ff315e';ctx.shadowBlur=13;ctx.shadowColor='#ff174f';ctx.beginPath();ctx.arc(b.x,b.y,4,0,7);ctx.fill()}ctx.shadowBlur=0;for(let p of ups){ctx.fillStyle=p.kind==='shield'?'#38f5ff':p.kind==='rapid'?'#ffd447':'#4dff8a';ctx.beginPath();ctx.arc(p.x,p.y,11,0,7);ctx.fill();ctx.fillStyle='#071127';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(p.kind==='shield'?'S':p.kind==='rapid'?'R':'+',p.x,p.y+4)}for(let p of particles){ctx.globalAlpha=Math.min(1,p.t*2);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1;if(mode==='play'&&(!invuln||Math.floor(elapsed*12)%2===0))drawShip(ship.x*W,ship.y*H);requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
